    - docs/GOLDEN_PRINCIPLES.md

  chief-architect-agent:
    # 🔴 REQUIRED, and this role is the reason the platform check was widened (gestalt #544,
    # 2026-11-19). It runs `runtime: base-agent` in APPEND mode — its profile comes from the
    # `architecture_reconciled` CONTRACT, not from a `schema:` block here — and the platform's
    # load-time check only ever saw YAML-declared `append:` blocks, so this role was running
    # with NO bound on its `save_` loop. Unset means UNBOUNDED; the run now REFUSES before
    # the first model call until it is set.
    #
    # 60 is the shipped template's own value for this role.
    max_iterations: 60
    # 🔴 DECIDED BY THE OWNER, 2026-11-10, resolving a template conflict — and the first change
    # is the one that was actively broken: this agent had `tools: {builtin: []}`, so it could read
    # NO file at all. By-reference reading is the platform standard (an input arrives as a path
    # plus a digest, never inlined), and an agent with no read tool cannot follow a reference;
    # `read_paths` would have governed nothing, because there was nothing to govern.
    #
    # Matches gestalt-verification's chief exactly — the configuration the platform's own
    # verification runs exercise.
    runtime: base-agent
    # Deliberately NOT `.gestalt/`: the chief reads the PROJECT. Its specialists' artifacts reach
    # it as references it materialises, and materialising one is what grants access to that path
    # for the run.
    # 🔴 NO `PLAN.md` (removed 2026-11-11, owner's decision; platform #475 did the same in the
    # template). It is never purged — `run_scratch_paths` touches nothing outside `.gestalt/`, so
    # the planning commit's PLAN.md merges to this project's default branch and stays. The chief
    # runs BEFORE `persist-plan`, the LAST stage of the planning phase, so during planning that
    # file holds the PREVIOUS feature's plan. Evidenced HERE: this repository's `main` carried
    # `594d4d13`'s plan (2026-10-07) while `93f4284a` was created 2026-10-08.
    #
    # Pointing an architect at it is worse than omitting it: the content looks authoritative and
    # belongs to a different feature. The platform now REFUSES this combination — a test derives
    # the planning roster from `pipeline.yaml` and checks both `read_paths` and `reference_paths`
    # against `STALE_DURING_PLANNING` — so restoring it needs that constant to change first,
    # which happens when PLAN.md moves under `.gestalt/<feature id>/`.
    read_paths: [docs, src, web, tests, HARNESS.json]
    # The one file it writes. A `base-agent` role with no write grant fails the pre-flight.
    write_paths: ['.gestalt/architecture/reconciled.json']
    rules:
    - Your role is reconciliation, not regeneration — work with what the specialists produced
    - Resolve symbol name conflicts by choosing one canonical name and applying it everywhere — across entities, repositories, services, and the markdown summary
    - Verify stack compliance across all three specialist designs before producing final output — if any specialist used a framework not in the declared stack, correct it
    - 'The final architecture must include: domain entities, conceptual table specifications (no SQL DDL), repository interfaces with concrete implementations, module boundaries, dependency map, and phase recommendations'
    - 'Name every module in the dependency map exactly as it derives from its path under a declared application root: `<prefix><name>` for a module under the `modules` container, `<prefix><container>-<name>` for any other container (so src/shared/date is `shared-date` and web/src/presentation/pages is `web-presentation-pages`). A map entry whose name does not derive this way is silently ignored by the dependency check — it does not fail, it simply never matches.'
    - Write ONE LINE PER EDGE in the dependency map, as `- <module> -> <comma-separated modules it may import>`. A module may appear on several lines; the reader unions them. Emit an entry for EVERY module in every declared application root, including the frontend ones — a module absent from the map is a module the dependency check cannot constrain.
    - If a specialist slice is missing (errors block in the prompt), reconcile around it — supply the minimum content needed to keep the feature buildable, not a fresh design
    - Every lifecycle state introduced by the domain architect must be reflected in architectureMdUpdate
    - Surface, do not swallow, open questions — if any specialist recorded an openQuestion, or you find a foundational semantics (counting, boundary, rounding, range, or unit) asserted narrowly in one place but relied on elsewhere, carry it into the reconciled openQuestions rather than silently picking a value (the BR-001 anti-pattern).
    - Reconcile the cross-cutting infrastructure contracts — carry the application architect's `authContract` and `errorResponseContract` and the data architect's `transactionContract` into the reconciled output, harmonising names/shapes across the slices (reconcile, do not regenerate). Whenever the feature has API endpoints, role-gated access, or multi-step atomic writes, the corresponding contract MUST be present and concrete in the final architecture, so a later phase relying on it finds the decision already made instead of absent. Leave each contract EMPTY when the feature has no corresponding surface; do NOT invent a contract no specialist decided and the feature does not need.
    role: "Chief architect and design reviewer"
    goal: "Reconcile the domain, data, and application designs into a single coherent architecture. Resolve conflicts, enforce stack compliance, ensure completeness."
    llm:
      # TR_053 amendment verification — Kimi-K2.6 was flaking on 12k
      # chief calls (~50% timeout rate observed). Switch chief to
      # DeepSeek-V3.2 to keep verification cycles flowing. Revisit
      # the chief model choice once DeepInfra Kimi stability improves.
      model: ~   # null = platform registry default (switched centrally; see gestalt scripts/register-llm-and-prices.sh)
      temperature: 0.1
      # 🔴 THE CONSULT COMPLETION CAP — ONE VALUE FOR ALL FIVE CONSULTABLE AGENTS (2026-10-10).
      #
      # Derived from 106 non-saturated consults in the platform's trace store: max answer 935, max
      # reasoning 21,162, max completion 21,610. 24,000 clears that with 1.11x headroom and turns a
      # runaway into a BOUNDED failure (`finish_reason: length` -> `UnexpectedModelBehavior` ->
      # `CONSULT_BUDGET_FAILURE`, which stops the consult chain instead of recursing).
      #
      # Per-agent observed maxima before this change (cap -> observed max completion, n):
      #   planner-agent          24,000 -> 21,610  n=42      data-architect-agent  6,000 -> 9,100  n=12
      #   chief-architect-agent  12,000 ->  3,715  n=28      domain-architect-agent 6,000 -> 1,755  n=18
      #   app-architect-agent     6,000 ->  1,133  n=6
      # `data-architect-agent` was TRUNCATING at 0.66x. One value rather than five because these
      # agents do the same job, the question is routed by topology not difficulty, and maxima
      # differing 19x on samples of 6-42 is mostly sampling noise.
      #
      # 🔴 THE 24,000 FOR planner-agent WAS HERE AND WAS REVERTED BY ACCIDENT. gestalt #275 applied
      # it to this file; trackeros #685 then reverted the premature merge of feature 93f4284a, and
      # the cap had only ever reached this repo inside that merge — so reverting the contamination
      # correctly took the legitimate config change with it, silently. It sat at 3,000 again, which
      # is BELOW the median observed completion of 7,113.
      # 🔴 RAISED 24,000 -> 32,000 (2026-10-11): 1.11x HEADROOM IS NOT HEADROOM. 24,000 sat just
      # above the largest of 106 observed consults, so the next slightly-longer one would be cut
      # off — and with no retry a cut-off consult is a FAILED consult, not a slower one. 32,000 is
      # 1.48x the pooled maximum and still under HALF the 65,536 runaway ceiling. It costs nothing
      # on an ordinary call: a completion cap is a ceiling, not an allocation, and the p50 consult
      # spends ~210 completion tokens.
      max_tokens: 32000
    tools:
      builtin: [readFile, listDirectory, searchFiles]   # §config-migration — explicit platform grant
    prompt_extensions:
      - When your output is a collection of items, produce them one at a time — commit each item as you finish it, reason in free text between items, and signal completion when none remain. Never emit the entire collection in a single response.
      - You receive three specialist designs. Your job is to reconcile them, not regenerate them.
      - Resolve naming conflicts by choosing the most semantically correct name and applying it consistently
      - If any specialist missed a stack compliance requirement, correct it
      - If a specialist slice is missing, supply the smallest reconciliation that keeps the feature buildable
      - Keep SQL schemas CONCEPTUAL (table name, field names, keys, index rationale) — do NOT write CREATE TABLE / SQL DDL
    profile: chief-architect
    # 🔴 THE PROMPT TEXT, FROM THE TEMPLATE (2026-11-18). It lived in the platform's Python
    # `AppendProfile` and reached the prompt only because the legacy dispatch fell back to it.
    # The base-agent runtime reads ONLY config (`BaseAgent.extra_instructions` -> 
    # `cfg.user_message`), so a role switched to it without this runs with no task line —
    # which is what this project's `runtime: base-agent` chief had been doing.
    user_message: |-
      Reconcile the three specialist designs above into ONE coherent architecture. Resolve symbol-name conflicts across specialists (harmonise entity and table names), fill cross-slice gaps (for example a domain entity with no table), verify stack compliance, and keep SQL CONCEPTUAL — table, field, key and index names only, NO DDL.

  planner-agent:
    rules:
    - Maximum 5 files per phase
    - Each phase must be independently deployable through CI and the gate
    - Phases must be ordered by dependency — never reference a file from a future phase
    - Domain model files (*.model.ts, interfaces, DTOs, types) must be in the same phase as any repository that uses them.
    - The architecture specification provided above defines the canonical type names, interface names, and symbol names for this feature. Use these exact names in all phase scopes. Do not invent alternative names or rename types.
    - The architecture's Module Boundaries (each module's declared `path` and the symbols it `owns`) are equally binding for FILE PLACEMENT. Every file you scope MUST be created under the exact directory the architecture declares for its owning module. If the architecture declares a module with path `X` that owns symbol `S`, the file defining `S` MUST live under `X` — never in a different directory (e.g. a generic `src/shared/types/` folder) unless the architecture itself declares that path for that symbol. Read the architecture's Module Boundaries and place every file accordingly. Do not invent alternative locations or relocate a symbol out of its declared module. This has the same binding authority as the naming rule above.
    phaseScopingRules:
    - 'GOOD scope: ''Create the model file at the exact path the architecture declares for its module (e.g. if the architecture''s Module Boundaries put the leave module at src/modules/leave/, use src/modules/leave/leave.model.ts) with the interfaces the architecture names. Import each type it references from the EXACT module path the architecture declares for THAT type — look up every symbol''s owning module in the Module Boundaries; never default an enum/type to a generic src/shared/types/ location unless the architecture declares it there.'' — specific, concrete, and every path matches the architecture''s declared module boundaries.'
    - 'BAD scope: ''Build the leave module'' — too broad, Aider will lose context.'
    - 'GOOD scope: ''Create src/modules/leave/leave.model.ts AND src/modules/leave/leave.repository.ts together. Define LeaveRequest, CreateLeaveRequestDto in the model file. Implement ILeaveRepository in the repository file referencing those types.'' — model and repository together so Aider sees both the field definitions and their usage in a single context.'
    - 'BAD scope: ''Create the service and routes and tests'' — multiple concerns, should be separate phases.'
    - Always mention existing files the phase depends on by exact path so Aider reads them before generating.
    - Include test file expectations in the scope — 'Include Jest unit tests in tests/unit/modules/leave/'.
    - Always include the domain model (interfaces / DTOs / types) and the repository in the SAME phase. Never put the DTO in phase N and the repository in phase N+1 — Aider cannot see the DTO fields when generating the repository and will hallucinate field names.
    - A phase that creates a repository MUST also include the DTO / interface file that defines the types the repository operates on.
    - 'Each phase scope MUST explicitly list the files created in prior phases that this phase depends on, using their exact paths. Example: ''This phase depends on src/modules/leave/leave.model.ts from Phase 1 — read it before generating any code that references its types.'' Without this, Aider will hallucinate field names instead of reading the actual type definitions.'
    - When writing a repository phase scope, always reference the exact model/interface file path from the prior phase. Never assume Aider knows what types exist.
    - The file list in each phase scope is an estimate. The architecture agent will produce the authoritative file list for each phase. Your scope text must not contradict the architecture output — if the architecture specifies 3 files, the scope must not claim 2.
    - When writing file counts in phase scopes, use 'approximately' or give a range rather than an exact number. The architecture agent determines the exact file list.
    role: "Technical project planner"
    goal: "Decompose a feature into a sequence of small, independently deployable phases that each fit within Aider's effective context window"
