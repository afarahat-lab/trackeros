  # ── Gate layer (Amendment 2026-06: tools enabled by default) ──
  constraint-agent:
    # 🔴 THE SINGLE RUNTIME (platform roadmap item 6), 2026-11-20. It lands WITH the
    # re-based budget below and cannot land before it: the loader refuses
    # `token_budget_basis` on a legacy role, and refuses a base-agent role whose budget
    # carries no basis. The figure and the counter it was chosen for stay together.
    runtime: base-agent
    # Raised from the 400k platform default after run ecef04ad's gate came back
    # INCONCLUSIVE: both gate agents were cut at ~817k/~795k against an effective
    # budget of 790k (the platform scales the default with diff size). The frontend
    # phase adds a whole second build — package.json, tsconfig, vite config and a
    # component tree — so the diff the gate must read is far larger than a backend
    # phase's. 1.2M matches the documented ceiling the whole-codebase global gate
    # already runs under, so it is a known-survivable bound rather than a guess.
    # 🔴 RE-BASED FOR THE WEIGHTED COUNTER (1,600,000 -> 2,000,000), 2026-11-20, and it is
    # NOT a raise. `runtime: base-agent` counts a budget with the price table's weights
    # (cache x0.02, output x4.0) where the legacy loop used 0.10 and 1.0, so the same
    # figure buys less work. Measured over every GENERATION named `constraint-agent` in the
    # platform's trace store (7,331 calls) the weighted counter totals 1.2491x the
    # legacy one, exactly (both weightings are linear in fresh/cache/output).
    #     1,600,000 x 1.2491 = 1,998,560  ->  2,000,000
    #
    # Both gate roles take constraint-agent's figure rather than their own: the platform
    # refuses a review budget below the phase gate's, and separate ratios would invert
    # them — the shape that cost a two-hour run on `93f4284a`.
    token_budget: 2000000
    token_budget_basis: weighted
    rules:
    - Data access is only permitted in the designated data access layer of this project. Code in business logic, presentation, or routing layers must delegate all data operations to the data access layer.
    - The data access layer is the only layer permitted to contain connection management, query execution, and direct interaction with the data store.
    - Each architectural layer communicates only with its immediately adjacent layer. Layers must not bypass intermediate layers.
    - Dependencies flow in one direction only — from outer layers toward inner layers. Inner layers must not depend on outer layers. Separately, a CROSS-MODULE dependency is permitted ONLY if the importing module's entry in the dependency map in ARCHITECTURE.md lists the imported module. An import of a module that is absent from that list IS a violation even when both modules sit at the same layer — report it with rule id dependency-direction.
    - Error handling must be explicit. Callers must not be exposed to unhandled failures from dependencies.
    - 'Do not redefine a symbol another module already owns. The platform has ALREADY enumerated every exported declaration in this repository and given you the complete list of names exported by more than one module, in the ''Symbol-ownership candidates (R6)'' section below. Judge those candidates: for each one, read the declarations and decide whether they are the SAME CONCEPT (same shape, same meaning, one rightful owner) or genuinely DIFFERENT concepts that happen to share a name. The test is conceptual identity, NOT name identity — a shared name with different fields or meaning, owned by THIS module, is a legitimately distinct declaration and is not a violation. Where they ARE the same concept, the fix is to import from the owning module''s public entry point instead of declaring a second copy. DO NOT search, grep, list or sweep the tree for candidates: the list is computed and complete, and a sweep is how this rule used to consume an entire review budget without reaching a verdict. The ''Deterministic checks the platform has ALREADY run'' block states R6''s result explicitly, including when it is zero — trust that line and do NOT grep to confirm it.'
    verificationGuidance:
    - Before evaluating any finding, read ARCHITECTURE.md to understand this project's specific layer names, boundaries, and directory structure. Use this to determine what constitutes the data access layer, business logic layer, and routing layer for this project.
    - A finding is only valid if it violates a rule given the actual structure of this project as described in ARCHITECTURE.md.
    - 'Scope your evaluation to the files changed in this phase only; files outside that set were passing
      before this phase, so do not re-evaluate them. When the ''Phase scope'' block LISTS the changed files,
      those are authoritative — evaluate exactly them and do NOT re-derive the list, because a second derivation
      can disagree with the one the platform already resolved. Only when the block gives a defaultBranch but
      no file list should you derive it yourself, and then use the gitDiff TOOL with baseRef `origin/<defaultBranch>`
      — never a shell `git diff`. gitDiff compares from the MERGE BASE; a shell `git diff origin/<defaultBranch>..HEAD`
      is two-dot and attributes the default branch''s OWN later changes to this branch as deletions. That
      produced a fully-reasoned false finding on 2026-10-12: a reviewer reported that a branch had removed
      147 lines of configuration that the default branch had ADDED after the branch was cut (the branch''s
      real change to that file was +14/-2). You cannot tell the difference from inside the output, so use
      the tool. If gitDiff fails or returns empty, fall through to evaluating the artifact files inlined above.'
    - 'The repository pattern is sanctioned data-access delegation. A business-logic-layer service that depends on a repository INTERFACE — via constructor injection or by importing the interface type — is correctly delegating data access to the data access layer; this is NOT a data-access-layer violation. Only flag a data-access violation when a non-data-access-layer file performs data access DIRECTLY: inline SQL, connection management, query execution, or direct datastore calls.'
    - Before reporting an import as a broken, missing, or non-existent dependency, confirm the target file is actually absent on the branch using readFile or `ls` via executeScript. A file created in a PRIOR phase is intentionally not in this phase's diff but DOES exist on the branch — never flag an import of a prior-phase file as broken or missing.
    - Consult the dependency-direction graph in ARCHITECTURE.md. A cross-module dependency that follows a documented allowed direction is sanctioned — do not flag it as a circular or bidirectional-dependency risk unless you find an ACTUAL reverse import that creates a cycle. Speculative risk is not a violation.
    - The project's shared infrastructure directory (the common/shared module location defined in ARCHITECTURE.md) hosts cross-cutting infrastructure — shared connection pools or clients, utility modules, and shared type definitions. This directory is sanctioned shared infrastructure, NOT a layering violation. Data-access-layer code that imports a shared connection pool or client from the shared infrastructure directory is following the correct pattern. Do NOT flag such imports as data-access-layer violations, and do NOT flag the shared connection/utility module itself as data access outside the data access layer.
    - A service class calling a method on an injected repository interface is correct delegation to the data-access layer. Do NOT flag this as direct data access — the call goes through the interface, not to a data store directly.
    - Reading properties or fields on a domain model object that was returned by a repository call is business logic, not data access. Do NOT flag field access on fetched domain objects as a data-access-layer violation.
    role: "Architectural constraint evaluator"
    goal: "Verify generated code satisfies all project architectural rules using executeScript + read-only file tools"
    llm:
      # TR_067 §3 — DeepSeek-V4-Pro at reasoning_effort: low. The
      # V3.2 default produced 21-tool-call 164k-token 203s runs on
      # Phase 1 of leave-management. ADR-043 specifies low reasoning
      # effort for deterministic gate checks; V4-Pro's higher
      # per-turn throughput + the §1 cap raise + the §2 git-diff
      # scoping should bring constraint-agent under 90s typical.
      model: ~   # null = platform registry default (switched centrally; see gestalt scripts/register-llm-and-prices.sh)
      temperature: 0.0
      # 🔴 2026-10-13 — 4000 -> 40000. This cap was CONFIGURED but never applied to
      # the model on the multi-append path (the path this agent runs on); #306 fixed
      # that forwarding, which made every such cap bind for the first time. At 4000 it
      # would have truncated ordinary work. Sized from 2,953 measured calls
      # (completion = output + output_reasoning, Langfuse events_core):
      #   p99 15,724 · largest legitimate 28,260 · 7 call(s) at the 65,536 ceiling
      # 40,000 is 1.42x the largest legitimate completion and stays under half
      # the registry ceiling, so it bounds a runaway without bounding real work.
      max_tokens: 40000
    tools:
      builtin: [executeScript, readFile, searchFiles, getFileTree, gitDiff]
    prompt_extensions: []
    reference_paths:
    - HARNESS.json
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md
    # §3 (2026-09-29) — back to 40, MONITORED. After-run 79f682f0 completed 5/5 with the largest
    # constraint-agent attempt at 30 calls and per-phase gates at 5-11, against 7-32 before. The
    # attempts that hit 40 did so on costs since removed: scope re-derivation (68 -> 11 calls), the
    # toolchain hunt (the platform now installs every declared build from its lockfile) and
    # whole-file reads. 40 leaves 33% headroom over the observed maximum; token_budget stays at the
    # 1,200,000 this project declares, so iterations remain the binding bound.
    # 🔴 REVISIT ON ANY CAP HIT — a gate cut at 40 again means a removed cost returned. Get the
    # tool-call breakdown from the platform's scripts/classify_tool_calls.py (cite its version).
    # 🔴 2026-10-12 — 40 -> 80 iterations, 1,200,000 -> 1,600,000 tokens. The cap was HIT on the
    # FEATURE review's two biggest slices, twice, and both reviews ended INCONCLUSIVE without
    # reaching a verdict (~$2.5 each):
    #
    #   slice        run 1 (18:30)                     run 2 (22:52)
    #   leave        64 calls, 827,447 tok, COMPLETE   63 calls, 721,751 tok, TRUNCATED
    #   (unscoped)   never reached                     62 calls, 566,988 tok, TRUNCATED
    #   all others   16-36 calls, complete             10-34 calls, complete
    #
    # Nearly identical work, FEWER tokens, opposite outcome — a marginal bound, not a cost that
    # came back. 1,600,000 matches review-agent at the same 80 iterations (the two run on the SAME
    # slices) and keeps ITERATIONS binding: ~18,000/iteration x 80 = ~1,450,000, binding at ~89.
    max_iterations: 80
    # 🔴 HELD AGAINST THE TEMPLATE (2026-11-10). The template's gate caps went NEUTRAL — 40 /
    # 1,000,000 — because the values below were calibrated on THIS project and were being
    # shipped to every project, including three-file repositories. These values stay, and the
    # `hold:` is what stops the next template upgrade from fast-forwarding them down: without
    # it the merge reads "project == base, template moved" as an upgrade not yet applied, and
    # applies it. A reason is required, so a hold cannot be a silent pin.
    hold:
      max_iterations: "cut at 40 on the two biggest feature-review slices: `leave` completed at 64 calls / 827,447 tokens, then truncated at 63 calls / 721,751 — a marginal bound, not an inflated call class"
      token_budget: "80 turns x 19,466 measured WEIGHTED tokens/turn needs 1,557,280, so ITERATIONS stay the binding bound at 2,000,000; the template ships 1,250,000, which would bind at ~64 turns, before the 80-turn cap. Re-stated for the weighted counter on 2026-11-20 — the old reason was arithmetic on the legacy counter (~18,000/turn) and no longer describes the bound in force"
    schema:
      models:
        _Finding:
          fields:
            rule_id:
              type: str
              optional: false
              description: Which rule was violated (the constraint id)
            file:
              type: str
              optional: false
              description: Path to the file containing the violation
            line:
              type: int
              optional: true
              description: 1-based line number, omit if file-wide
            quoted_line:
              type: str
              optional: false
              description: The exact offending line, copied verbatim
            explanation:
              type: str
              optional: false
              description: What is wrong and why this line violates the rule
            severity:
              type: str
              optional: false
              enum:
              - low
              - medium
              - high
              - critical
      fields: {}
      append:
        findings: _Finding
      finalize:
        summary:
          type: str
          optional: false
          description: One-line summary, e.g. "2 violations found"
      required_non_empty: []

