    token_budget_basis: weighted
    # 🔴 THE APPEND LOOP'S BOUND, required for any `append:` profile — unset means UNBOUNDED,
    # and the thing it bounds is a model that keeps calling `save_` with nothing to stop it.
    # 40 is the same value the three generate-family append profiles carry: a specialist emits
