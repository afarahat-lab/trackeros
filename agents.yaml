# agents.yaml — Gestalt agent configuration
#
# Seeded by 'gestalt init'. Safe to customise — operators tune prompts,
# change LLM parameters, and add prompt extensions per project without
# touching framework code.
#
# Infrastructure agents (pipeline-agent, promotion-agent, gc-agent)
# do deterministic work and are NOT configurable here.
#
# constraint-agent and test-runner-agent ARE LLM-driven as of
# TEST_REPORT_005 (executeScript evolution) — their behaviour is
# controlled by HARNESS.json's `agentConfig.<agent-name>.rules`
# (plain-English rules) plus the executeScript tool. They appear
# in the agents list at the bottom for reference but do not need
# to be customised here unless an operator wants to override the
# default tool set or LLM parameters.
#
# Key conventions:
#   role  — short professional title (becomes "You are <role> working on
#           the Gestalt platform.")
#   goal  — one sentence stating what the agent is trying to accomplish
#   llm.model         — '~' (YAML null) means "use the platform default
#                       from .env LLM_MODEL". Set to a specific model
#                       name (e.g. "gpt-4o", "gpt-4o-mini") to override.
#                       The override reuses the platform's baseUrl +
#                       apiKey — only the model name changes on the wire.
#   llm.temperature, llm.max_tokens — override the platform defaults
#   prompt_extensions — list of standing project rules appended to every
#                       prompt under a "Project-specific instructions"
#                       heading

agents:

  intent-agent:
    # 🔴 REQUIRED FOR AN APPEND PROFILE since 2026-11-13, and this project never received it:
    # the bound is what stops a `save_` loop and unset means UNBOUNDED, so the loader REFUSES
    # the role. Measured 2026-11-18: this role could not load at all here. The value is the
    # shipped template's, which carries the measurement behind it.
    max_iterations: 40
    rules:
    - "Before finalizing your output, cross-check it against the project's maintained architecture (docs/ARCHITECTURE.md and .gestalt/architecture/reconciled.json) — provided to you as gathered reference context, NOT as an expansion of your task. If your output would contradict a decision already recorded there, do NOT silently diverge: flag the inconsistency (or consult the agent that owns it) so it is resolved deliberately. The maintained document is the source of truth for existing decisions."
    - This intent describes a single phase of a multi-phase feature. If a 'Deferred to later phases' section is present, the items listed there are intentionally out of scope for this phase. Do not flag them as ambiguities or missing functionality.
    - Evaluate the intent against what this phase explicitly commits to delivering, not against the full feature description.
    - Interface method signatures in per-phase architecture specifications are CONTRACTS to be implemented by the code-agent during this phase. They are not stubs. An interface showing method signatures without bodies is correct and complete — do not flag missing method bodies as ambiguity or missing implementation.
    - When a '## Canonical dependencies for this phase' or '## Canonical entity fields for this phase' block is present in the intent text, those lists are the authoritative output of the per-phase architecture pass, which runs AFTER the intent text was generated. The intent text may reference outdated names from an earlier planning pass. This is EXPECTED and is NOT ambiguity. Do NOT emit a CONTEXT_GAP signal for any mismatch between names in the intent text and names in the canonical blocks. Instead, silently treat the canonical block as the correct specification and proceed. Mismatched names between intent text and canonical blocks are never high-impact ambiguity.
    role: "Senior software architect"
    goal: "Extract a precise, unambiguous specification from a natural language intent"
    llm:
      # TR_050 — DeepInfra-hosted DeepSeek-V3.2 (chat-completions
      # apiShape); reasoning_effort intentionally omitted (not
      # supported by DeepInfra OpenAI-compatible endpoint).
      model: ~   # null = platform registry default (switched centrally; see gestalt scripts/register-llm-and-prices.sh)
      temperature: 0.1
      max_tokens: 2000
    tools:
      builtin: [readFile, searchFiles]   # §config-migration — explicit platform grant
    prompt_extensions: []
    profile: intent
    # 🔴 THE PROMPT TEXT, FROM THE TEMPLATE (2026-11-18). It lived in the platform's Python
    # `AppendProfile` and reached the prompt only because the legacy dispatch fell back to it.
    # The base-agent runtime reads ONLY config (`BaseAgent.extra_instructions` -> 
    # `cfg.user_message`), so a role switched to it without this runs with no task line —
    # which is what this project's `runtime: base-agent` chief had been doing.
    task: |-
      Analyse the intent and extract the IntentSpec.
    user_message: |-
      Analyse the intent in the context above, following the mandatory rules already in the system prompt. First read the reference files listed in the system prompt (ARCHITECTURE.md for system boundaries, AGENTS.md for conventions); use searchFiles to inspect existing patterns. Then produce the IntentSpec by calling the save_<field> tools — one call per success criterion (save_successCriteria), constraint (save_constraints, field 'value'), out-of-scope item (save_outOfScope, field 'value'), and ambiguity (save_ambiguities, with its options + impactIfWrong). When done, call `complete` with the scope object (affectedDomains, affectedLayers, isBreakingChange, estimatedComplexity).
    reference_paths:
    - HARNESS.json
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md
    - AGENTS.md
    - PLAN.md
    - .gestalt/architecture/reconciled.json
    schema:
      models:
        _SuccessCriterion:
          fields:
            description:
              type: str
              optional: false
            testable:
              type: bool
              optional: false
              default: true
            layer:
              type: str
              optional: false
              enum:
              - unit
              - integration
              - e2e
              default: unit
        _Ambiguity:
          fields:
            description:
              type: str
              optional: false
            options:
              type: list[str]
              optional: false
              default_factory: list
            impact_if_wrong:
              type: str
              optional: false
              enum:
              - low
              - medium
              - high
              default: low
        _StringValue:
          fields:
            value:
              type: str
              optional: false
      fields: {}
      append:
        successCriteria: _SuccessCriterion
        constraints: _StringValue
        outOfScope: _StringValue
        ambiguities: _Ambiguity
      finalize:
        affected_domains:
          type: list[str]
          optional: false
          default_factory: list
        affected_layers:
          type: list[str]
          optional: false
          default_factory: list
        is_breaking_change:
          type: bool
          optional: false
          default: false
        estimated_complexity:
          type: str
          optional: false
          enum:
          - small
          - medium
          - large
          default: medium
      required_non_empty:
      - successCriteria

  design-agent:
    # 🔴 REQUIRED FOR AN APPEND PROFILE since 2026-11-13, and this project never received it:
    # the bound is what stops a `save_` loop and unset means UNBOUNDED, so the loader REFUSES
    # the role. Measured 2026-11-18: this role could not load at all here. The value is the
    # shipped template's, which carries the measurement behind it.
    max_iterations: 40
    role: "Senior software architect"
    goal: "Produce domain model changes, API contracts, and component specs"
    llm:
      model: gestalt-default
      temperature: 0.2
      max_tokens: 4000
    tools:
      builtin: [readFile, listDirectory, searchFiles]   # §config-migration — explicit platform grant
    prompt_extensions:
      - When your output is a collection of items, produce them one at a time — commit each item as you finish it, reason in free text between items, and signal completion when none remain. Never emit the entire collection in a single response.
    profile: design
    # 🔴 THE PROMPT TEXT, FROM THE TEMPLATE (2026-11-18). It lived in the platform's Python
    # `AppendProfile` and reached the prompt only because the legacy dispatch fell back to it.
    # The base-agent runtime reads ONLY config (`BaseAgent.extra_instructions` -> 
    # `cfg.user_message`), so a role switched to it without this runs with no task line —
    # which is what this project's `runtime: base-agent` chief had been doing.
    task: |-
      Produce the design spec for this intent — domain changes, API contracts, and component specs. Return them as a single JSON object exactly matching the structure described.
    user_message: |-
      Produce the design spec for this intent, following the mandatory rules already in the system prompt. First read the reference files listed in the system prompt (ARCHITECTURE.md for existing boundaries); use readFile / listDirectory / searchFiles to inspect existing modules and patterns. Then call the save_<field> tools — one call per domain change (save_domainChanges), API contract (save_apiContracts), and component spec (save_componentSpecs). When every item is saved, call `complete`.
    rules:
    - 'Before finalizing your output, cross-check it against the project''s maintained architecture
      (docs/ARCHITECTURE.md and .gestalt/architecture/reconciled.json) — provided to you as gathered
      reference context, NOT as an expansion of your task. If your output would contradict a decision
      already recorded there, do NOT silently diverge: flag the inconsistency (or consult the agent
      that owns it) so it is resolved deliberately. The maintained document is the source of truth for
      existing decisions.'
    reference_paths:
    - HARNESS.json
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md
    - AGENTS.md
    - PLAN.md
    - .gestalt/architecture/reconciled.json
    schema:
      models:
        _Field:
          fields:
            name:
              type: str
              optional: false
            type:
              type: str
              optional: false
            required:
              type: bool
              optional: false
        _Relationship:
          fields:
            entity:
              type: str
              optional: false
            type:
              type: str
              optional: false
        _DomainChange:
          fields:
            entity_name:
              type: str
              optional: false
            operation:
              type: str
              optional: false
              enum:
              - create
              - update
            fields:
              type: list[_Field]
              optional: false
              default_factory: list
            relationships:
              type: list[_Relationship]
              optional: false
              default_factory: list
        _ApiContract:
          fields:
            method:
              type: str
              optional: false
              enum:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
            path:
              type: str
              optional: false
            description:
              type: str
              optional: false
            request_body:
              type: dict[str, str]
              optional: true
            response_body:
              type: dict[str, str]
              optional: true
            auth_required:
              type: bool
              optional: false
              default: false
            roles:
              type: list[str]
              optional: false
              default_factory: list
        _ComponentSpec:
          fields:
            name:
              type: str
              optional: false
            type:
              type: str
              optional: false
              enum:
              - page
              - component
              - hook
              - service
            description:
              type: str
              optional: false
            props:
              type: dict[str, str]
              optional: true
      fields: {}
      append:
        domainChanges: _DomainChange
        apiContracts: _ApiContract
        componentSpecs: _ComponentSpec
      finalize: {}
      required_non_empty: []

  intent-design-agent:
    rules:
    - "Before finalizing your output, cross-check it against the project's maintained architecture (docs/ARCHITECTURE.md and .gestalt/architecture/reconciled.json) — provided to you as gathered reference context, NOT as an expansion of your task. If your output would contradict a decision already recorded there, do NOT silently diverge: flag the inconsistency (or consult the agent that owns it) so it is resolved deliberately. The maintained document is the source of truth for existing decisions."
    - This spec describes a single phase of a multi-phase feature. If a 'Deferred to later phases' section is present, the items there are intentionally out of scope for this phase — do not flag them as ambiguities or missing functionality.
    - Evaluate the intent against what this phase explicitly commits to delivering, not against the full feature description.
    - Specify WHAT the implementation must satisfy (success criteria, entity/interface invariants, consistency requirements), NOT how to build it. Do not prescribe HTTP methods/paths, component names, or field lists — the code agent chooses the implementation shape.
    - A consistency requirement MUST name the exact file/interface to match (referencePath), so the code agent can reuse the existing type/method/pattern instead of drifting.
    - "Transaction boundaries: the SERVICE owns the unit of work (it decides what is inside the transaction) and the DATA-ACCESS layer opens it. Services take an injected IUnitOfWork with withTransaction(fn) and never import a pool, a client, or a module-level db helper. Do NOT put withTransaction on a repository. Participating repository and service methods take the client as an optional LAST parameter and fall back to the shared pool when it is omitted. See AGENTS.md 'Architecture rules' item 5."
    role: "Senior software architect"
    goal: "Specify the phase's success criteria, constraints, and the consistency + interface invariants the implementation must satisfy — leaving implementation shape to the code agent"
    llm:
      # Pin to Deepseek-v4-pro like every other project agent. Was `model: ~` (null), which
      # silently inherited the platform default LLM_MODEL (now glm-5p2) — a leftover from the
      # intent+design consolidation (context-agent got pinned then; this one was missed), so this
      # high-impact spec agent was running on a weaker/different model than the rest of the pipeline.
      model: ~   # null = platform registry default (switched centrally; see gestalt scripts/register-llm-and-prices.sh)
      temperature: 0.15
      # 🔴 2026-10-13 — 5000 -> 12000. This cap was CONFIGURED but never applied to
      # the model on the multi-append path (the path this agent runs on); #306 fixed
      # that forwarding, which made every such cap bind for the first time. At 5000 it
      # would have truncated ordinary work. Sized from 3,107 measured calls
      # (completion = output + output_reasoning, Langfuse events_core):
      #   p99 3,498 · largest legitimate 6,930 · 0 call(s) at the 65,536 ceiling
      # 12,000 is 1.73x the largest legitimate completion and stays under half
      # the registry ceiling, so it bounds a runaway without bounding real work.
      max_tokens: 12000
    tools:
      builtin: [readFile, listDirectory, searchFiles]
    prompt_extensions:
      - "When your output is a collection of items, produce them one at a time — commit each item as you finish it, reason in free text between items, and signal completion when none remain. Never emit the entire collection in a single response."
    profile: intent-design
    # 🔴 THE PROMPT TEXT, FROM THE TEMPLATE (2026-11-18). It lived in the platform's Python
    # `AppendProfile` and reached the prompt only because the legacy dispatch fell back to it.
    # The base-agent runtime reads ONLY config (`BaseAgent.extra_instructions` -> 
    # `cfg.user_message`), so a role switched to it without this runs with no task line —
    # which is what this project's `runtime: base-agent` chief had been doing.
    task: |-
      Specify this phase: its success criteria, constraints, and the entity/interface/consistency invariants the implementation MUST satisfy. Do NOT prescribe implementation shape — no HTTP methods/paths, no component names, no field lists; the code agent chooses the shape.
    user_message: |-
      Analyse the intent + phase scope in the context above, following the mandatory rules in the system prompt. FIRST investigate the real codebase (readFile / listDirectory / searchFiles) and the reference docs — the constraint fields are only answerable from what already exists. Then call the save_<field> tools:
      - ALWAYS produce at least one measurable success criterion (save_successCriteria). This is a planner-decomposed phase, so DERIVE the criteria from the phase scope / PLAN.md even when it does not state them verbatim — a criterion is what a reviewer can check is DONE (e.g. 'the Status enum exposes DRAFT/ACTIVE/ARCHIVED', 'the repository.create call persists a row and returns it', 'invalid input is rejected with a typed error'). Never leave successCriteria empty on the grounds that PLAN.md was not explicit — synthesise them from the phase's purpose.
      - one call per success criterion (save_successCriteria), constraint (save_constraints, field 'value'), out-of-scope item (save_outOfScope, field 'value'), and ambiguity (save_ambiguities with options + impactIfWrong);
      - one call per entity invariant (save_entityInvariants: entity + its lifecycle/rule, NOT its fields), interface constraint (save_interfaceConstraints: the operation that must exist + its auth/idempotency/error rules, NOT its route/verb/body), consistency requirement (save_consistencyRequirements: what to reuse/match + the referencePath to it), and integration point (save_integrationPoints).
      You decide implementation SHAPE by leaving it out — specify only what must hold. When done, call `complete` with the scope object (affectedDomains, affectedLayers, isBreakingChange, estimatedComplexity).
    reference_paths:
    - HARNESS.json
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md
    - AGENTS.md
    - PLAN.md
    - .gestalt/architecture/reconciled.json
    max_iterations: 10
    token_budget: 600000
    schema:
      models:
        _SuccessCriterion:
          fields:
            description:
              type: str
              optional: false
            testable:
              type: bool
              optional: false
              default: true
            layer:
              type: str
              optional: false
              enum:
              - unit
              - integration
              - e2e
              default: unit
        _Ambiguity:
          fields:
            description:
              type: str
              optional: false
            options:
              type: list[str]
              optional: false
              default_factory: list
            impact_if_wrong:
              type: str
              optional: false
              enum:
              - low
              - medium
              - high
              default: low
        _StringValue:
          fields:
            value:
              type: str
              optional: false
        _EntityInvariant:
          fields:
            entity:
              type: str
              optional: false
            must_exist_or_extend:
              type: bool
              optional: false
              default: true
            invariant:
              type: str
              optional: false
        _InterfaceConstraint:
          fields:
            operation:
              type: str
              optional: false
            auth_rule:
              type: str
              optional: false
              default: ''
            idempotent:
              type: bool
              optional: false
              default: false
            error_semantics:
              type: str
              optional: false
              default: ''
        _ConsistencyRequirement:
          fields:
            requirement:
              type: str
              optional: false
            reference_path:
              type: str
              optional: false
              default: ''
        _IntegrationPoint:
          fields:
            target:
              type: str
              optional: false
            why:
              type: str
              optional: false
              default: ''
      fields: {}
      append:
        successCriteria: _SuccessCriterion
        constraints: _StringValue
        outOfScope: _StringValue
        ambiguities: _Ambiguity
        entityInvariants: _EntityInvariant
        interfaceConstraints: _InterfaceConstraint
        consistencyRequirements: _ConsistencyRequirement
        integrationPoints: _IntegrationPoint
      finalize:
        affected_domains:
          type: list[str]
          optional: false
          default_factory: list
        affected_layers:
          type: list[str]
          optional: false
          default_factory: list
        is_breaking_change:
          type: bool
          optional: false
          default: false
        estimated_complexity:
          type: str
          optional: false
          enum:
          - small
          - medium
          - large
          default: medium
      required_non_empty:
      - successCriteria

  context-agent:
    # 🔴 REQUIRED FOR AN APPEND PROFILE since 2026-11-13, and this project never received it:
    # the bound is what stops a `save_` loop and unset means UNBOUNDED, so the loader REFUSES
    # the role. Measured 2026-11-18: this role could not load at all here. The value is the
    # shipped template's, which carries the measurement behind it.
    max_iterations: 40
    role: "Technical writer"
    # 🔴 EDITS DOCUMENTS THROUGH WRAPPED SERENA (owner, 2026-11-26; rulings 2026-11-27 —
    # docs/claude/DECISIONS.md#context-agent-serena-2026-11-27). It produces `domain_doc`,
    # `decisions_doc` and `agents_doc` (pipeline.yaml), and that `produces:` IS its write authority
    # for those judged documents. It does NOT write docs/ARCHITECTURE.md: the planning-time
    # architecture node owns `architecture_doc`. It still READS it (reference_paths).
    #
    # 🔴 SWITCHED TO `runtime: base-agent` 2026-11-27, MEETING THE CONDITION ITS 2026-11-24 REVERT
    # SET: "switch this role only after the write-and-refuse mechanics move into BaseAgent,
    # parameterised by ARTIFACT rather than by role." They now live in the document-editing
    # dispatch, chosen because this node's `produces` names `kind: document` artifacts: Serena edits
    # a STAGED copy, every write is checked against `produces` before it is forwarded, refusals
    # become findings, and the staged copy is validated and applied in one commit — or not at all.
    # The legacy `context` profile's `save_updates` (edits the PLATFORM applied) is gone from this
    # role; the agent now edits, and the platform only checks and applies.
    runtime: base-agent
    write_paths:
      - docs/DOMAIN.md
      - docs/DECISIONS.md
      - AGENTS.md
    goal: "Keep project context files accurate and up to date"
    llm:
      # TR_061-followup — was `model: ~` (platform default). The TR_061
      # second run hit a moonshotai/Kimi-K2.6 timeout in context-agent's
      # tool-loop because the env LLM_MODEL fallback resolved to Kimi
      # before the registry default could take over. Pin to V4-Pro
      # explicitly to bypass the env-fallthrough.
      model: ~   # null = platform registry default (switched centrally; see gestalt scripts/register-llm-and-prices.sh)
      temperature: 0.1
      # 🔴 2026-10-13 — 8000 -> 40000. This cap was CONFIGURED but never applied to
      # the model on the multi-append path (the path this agent runs on); #306 fixed
      # that forwarding, which made every such cap bind for the first time. At 8000 it
      # would have truncated ordinary work. Sized from 2,426 measured calls
      # (completion = output + output_reasoning, Langfuse events_core):
      #   p99 19,276 · largest legitimate 30,913 · 0 call(s) at the 65,536 ceiling
      # 40,000 is 1.29x the largest legitimate completion and stays under half
      # the registry ceiling, so it bounds a runaway without bounding real work.
      max_tokens: 40000
    tools:
      builtin:
        - readFile          # read existing context files before updating
        - listDirectory     # explore the docs/ structure
        - searchFiles       # find where references need to change
        - getFileTree       # understand project layout
        - gitDiff           # see this phase's diff before updating docs
    prompt_extensions: []
    # 🔴 THE PROMPT TEXT, FROM THE TEMPLATE (2026-11-18). It lived in the platform's Python
    # `AppendProfile` and reached the prompt only because the legacy dispatch fell back to it.
    # The base-agent runtime reads ONLY config (`BaseAgent.extra_instructions` -> 
    # `cfg.user_message`), so a role switched to it without this runs with no task line —
    # which is what this project's `runtime: base-agent` chief had been doing.
    task: |-
      Update the project context documents to reflect what this phase ACTUALLY built — document the committed implementation, not the plan. Only edit documents that genuinely need to change.
    user_message: |-
      This runs AFTER code-generation, so the phase's code is committed on this branch. Inspect the REAL committed diff with gitDiff (+ readFile) to see what was actually implemented, and document THAT. Use the phase spec's invariants/constraints only as a CHECK against drift: if the code diverges from a spec invariant, document the code as built and note the divergence — do NOT document the plan's prescribed shape when the implementation chose a different valid one.

      HOW TO READ AND EDIT. The documents you maintain are docs/DOMAIN.md, docs/DECISIONS.md and AGENTS.md; you edit them with Serena's tools, and every edit is checked and validated before anything is applied.
      1. Read the PHASE DIFF first (gitDiff), so you know which documentation is affected.
      2. Find the section to change without reading a whole document: `get_symbols_overview(relative_path=...)` lists its headings, and `find_symbol(name_path_pattern="<heading>", relative_path=..., include_body=true)` returns one section.
      3. Edit with `replace_content(relative_path, needle, repl, mode="literal")` to change text inside a section, or `insert_before_symbol(name_path="<heading>", relative_path, body)` to add a new section before an existing heading — end the body with a blank line.
      4. Change ONLY the sections the phase affects. End-of-run validation refuses the whole run if a section you did not address changed, and then NOTHING is applied.

      🔴 do NOT read a large document whole: a tool loop re-sends the whole conversation on every turn, so one full read is paid again on every remaining turn.

      When you are done, report what you changed. If nothing needs to change, say so and change nothing.
    reference_paths:
    # §3 — narrowed to the files this agent MAINTAINS. Audited on run f890ed1a: all five
    # previous references were read exactly 8 times each (once per invocation) — the turn-1
    # bulk load, not evidence of need. GOLDEN_PRINCIPLES.md dropped because Brief 1 means this
    # agent cannot write it and documenting what a phase built does not need to read it;
    # HARNESS.json and PLAN.md dropped as redundant with the injected phase spec.
    - docs/ARCHITECTURE.md
    - docs/DOMAIN.md
    - docs/DECISIONS.md
    - AGENTS.md
    # 🔴 RE-BASED FOR THE WEIGHTED COUNTER, 2026-11-27, by the same method as constraint-agent's:
    # legacy weights fresh x1, cache x0.1, output x1; BaseAgent fresh x1, cache x0.02, output x4
    # (output INCLUDING reasoning — disjoint keys in this store). MEASURED over every GENERATION
    # tagged `gestalt_agent = context-agent` (3,381 calls): the weighted counter totals 0.8954x the
    # legacy one — LOWER, because this role's traffic is cache-heavy (249M cache-read vs 25M fresh
    # input tokens). Positive control, same query: constraint-agent 1.2486x against its recorded
    # 1.2491x.   800,000 x 0.8954 = 716,320 -> 720,000
    token_budget: 720000
    token_budget_basis: weighted
    schema:
      fields:
        summary:
          type: str
          optional: false
          description: What you changed in which document and why — or that nothing needed to change.
  code-agent:
    # 🔴 TEMPLATE WORDING TAKEN IN FULL (owner, 2026-11-10), the transaction-boundary rule
    # included. Three of the four project-only rules were TypeScript/npm specifics —
    # `package.json`, `resolveJsonModule`, `require()` — which the template moved into `AGENTS.md`
    # section `## Stack conventions`. That section did NOT exist here, so this PR adds it: the
    # facts are preserved, in the document the agent reads, and the rules stop carrying project
    # specifics.
    #
    # The fourth needed no move. `AGENTS.md` ALREADY states transaction boundaries twice — as
    # `## Architecture rules` rule 5 and in full under `### 5 — transaction boundaries (decided
    # 2026-08-30)` — and `AGENTS.md` is in this agent's `reference_paths`. The custom rule was a
    # third copy of a fact already in the document the agent reads.
    rules:
    - Generated code must compile without errors. Verify with executeScript before returning.
    - All imports must resolve to a file that exists in the project or to a dependency the project's own manifest declares. AGENTS.md names this project's manifest and its import conventions — read it rather than assuming one stack's.
    - You MUST run a compile/lint check via executeScript before emitting the final files. This is not optional.
    - Follow the import and module conventions in AGENTS.md section `## Stack conventions`. They are this project's, derived from its own stack; do not apply another stack's module syntax, build settings or compiler flags because they are familiar.
    - Before generating any repository, service, or controller code, read the DTO and interface files it will use. Never reference a field on a type without confirming it exists in the type definition.
    - Before generating code that calls methods on a dependency, read the dependency's source file to confirm which methods exist. Only call methods that are actually defined.
    - Read the project's compiler/linter configuration file (tsconfig.json, mypy.ini, pyproject.toml, .eslintrc etc) before generating code. Follow the strictness settings it defines — do not assume permissive defaults.
    - Read the project's dependency manifest (package.json, requirements.txt, go.mod, pom.xml etc) before importing external packages. Only import packages that are listed as dependencies.
    - Your verification command is configured to fail when no source implementation files exist. You MUST write implementation files before verification can pass. Do not consider the task complete based on a passing verification that ran before any source files were written.
    - When code in one module needs data or behaviour owned by another module, depend on that module's DECLARED PUBLIC ENTRY POINT — never import another module's private internals. Within a module, importing its own internals is correct. `docs/ARCHITECTURE.md` states what this project's modules expose publicly; read it rather than assuming a layering convention.
    - Every method that calls an injected repository or external service must wrap the call in explicit error handling. Do not let errors from dependency calls propagate unhandled.
    role: "Senior TypeScript engineer"
    goal: "Generate production-quality TypeScript code that follows the project harness"
    llm:
      model: gestalt-code
      temperature: 0.2
      max_tokens: 8000
    tools:
      builtin:
        - readFile          # read existing files before modifying
        - listDirectory     # explore the project structure
        - searchFiles       # find where things are defined
        - getFileTree       # understand project layout
        - executeScript     # verify generated code (compile / lint / etc.)
                            # The agent picks the command — there are NO
                            # hardcoded shell strings on the platform.
                            # Hard blocklist: rm -rf, git push/commit/reset/rebase,
                            # curl|sh, wget|sh, > /etc/, sudo (never overridable).
      # ADR-039 — MCP (Model Context Protocol) servers extend the
      # agent with external tools (issue trackers, dashboards, docs).
      # Tool names are auto-namespaced as `<serverName>__<toolName>`
      # so they cannot shadow the built-ins.
      #
      # token_from sources:
      #   harness            — reads HARNESS.json mcp.servers[].token
      #                        (token sits in the project repo —
      #                        visible to anyone with repo access)
      #   project_credential — reuses the project Git PAT
      #   env:VAR_NAME       — reads process.env.VAR_NAME on the
      #                        server process (recommended for any
      #                        sensitive secret)
      # mcp:
      #   - name: github
      #     url: https://mcp.github.com/v1
      #     token_from: env:GITHUB_MCP_TOKEN
      #   - name: localfs
      #     url: stdio:npx @modelcontextprotocol/server-filesystem /tmp/project
      #     token_from: env:NOOP   # stdio servers usually don't need a token
    # Stack-specific coding conventions generated by the
    # `generateStackConfig` LLM call at `gestalt init` time.
    # Add more project-specific extensions below as needed.
    prompt_extensions:
      - Begin each phase with the architect edit format — it plans multi-file changes best. Only fall back to the diff edit format when you have EVIDENCE of assistant-mode drift in the feedback (the model acknowledged file additions conversationally without producing edits, and no files were written). Do not pre-emptively avoid architect.
      - Use ES module syntax with resolveJsonModule for JSON imports — never require()
      - Use async/await throughout, never callbacks
    reference_paths:
    - HARNESS.json
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md
    - AGENTS.md
    - PLAN.md
    max_iterations: 30
    condenser_max_tokens: 50000
    condenser_max_size: 80
    delegation_max_subtasks: 4
    delegation_subagent_iterations: 30

