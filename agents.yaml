  # ─── Architecture crew (TR_051 / ADR-056 Phase 1) ────────────────────
  # LangGraph StateGraph: three specialists deliberate in parallel,
  # then chief reconciles. This is the architecture layer, whole. It
  # REPLACED the single `architecture-agent`, which was removed on
  # 2026-11-22: no pipeline node named it and `designPhase` /
