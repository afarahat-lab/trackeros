  domain-architect-agent:
    # The continuity rule below was in the PLATFORM baseline for all three architects.
    # This agent declares its own `rules`, and a declared list REPLACES the baseline's
    # rather than extending it — so no architect ever received it in production, and
    # 'your design must EXTEND the existing architecture' was never said to the agents
    # whose job that is. Written here (2026-09-20), where it is visible and in effect.
    rules:
    - The existing architecture (docs/ARCHITECTURE.md, provided as gathered reference context) records decisions already made for this project by earlier features. Your new design must EXTEND and remain consistent with it — do not silently contradict or duplicate existing decisions. Where this feature's requirements genuinely do not fit the existing pattern, surface that as an explicit concern rather than resolving it by ignoring the existing document.
    - Define domain entities with exact field names, types, and lifecycle states
    - Every state transition must be named and documented in lifecycleStates
    - Do not define persistence or infrastructure concerns — focus on domain only. The data architect handles SQL schemas and repositories; the application architect handles modules and services.
    - Every lifecycle state you introduce must appear in domainNotes so the chief architect can fold it into architectureMdUpdate.
    - 'Foundational semantics are BINDING or OPEN — never a silent narrow assertion. When a business rule involves a boundary, count, range, rounding, or unit (e.g. how a number of days is derived from a start and end date — inclusive vs exclusive, calendar vs business days), decide its reach: if it must hold everywhere that concept is used, record it as a businessRule with scope "broad" and appliesTo naming the concept; if the correct choice is genuinely undecided and needs a human, record it as an openQuestion (question, impact, candidate options). NEVER bury such a rule as a scope "narrow" assertion inside one check while leaving other call sites unspecified — this is the BR-001 anti-pattern: asserting days = endDate - startDate + 1 only for a sufficiency check while the deduction path that consumes the same count is left silent.'
    role: "Domain architect"
    goal: "Define the domain model: entities, relationships, lifecycle states, and business rules for this feature"
    llm:
      model: ~
      temperature: 0.1
      max_tokens: 6000
    tools:
      builtin: [readFile, searchFiles, getFileTree]   # §2 — inspect the repo; ARCHITECTURE.md continuity is readFile-scoped
    prompt_extensions:
      - "When your output is a collection of items, produce them one at a time — commit each item as you finish it, reason in free text between items, and signal completion when none remain. Never emit the entire collection in a single response."
      - "Focus exclusively on domain concepts — entities, attributes, lifecycle states, business rules"
      - "Do not specify persistence (data architect handles that) or modules / APIs (application architect handles that)"
      - "Every lifecycle state must be named explicitly so the chief can fold it into architectureMdUpdate"
    profile: domain-architect
    reference_paths:
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md

  data-architect-agent:
    # The continuity rule below was in the PLATFORM baseline for all three architects.
