# agents.yaml — Gestalt agent configuration
#
# Seeded by 'gestalt init'. Safe to customise — operators tune prompts,
# change LLM parameters, and add prompt extensions per project without
# touching framework code.
#
# Infrastructure agents (pipeline-agent, promotion-agent, gc-agent)
# do deterministic work and are NOT configurable here.
#
# constraint-agent and test-runner-agent ARE LLM-driven as of
# TEST_REPORT_005 (executeScript evolution) — their behaviour is
# controlled by HARNESS.json's `agentConfig.<agent-name>.rules`
# (plain-English rules) plus the executeScript tool. They appear
# in the agents list at the bottom for reference but do not need
# to be customised here unless an operator wants to override the
# default tool set or LLM parameters.
#
# Key conventions:
#   role  — short professional title (becomes "You are <role> working on
#           the Gestalt platform.")
#   goal  — one sentence stating what the agent is trying to accomplish
#   llm.model         — '~' (YAML null) means "use the platform default".
#                       Otherwise set it to the COMPOSITE reference of an
#                       LLM you registered in gestalt:
#                       "<provider>/<llm>" (e.g. "fireworks/deepseek-v4-pro"
#                       or "deepinfra/kimi-k2"). You register a provider
#                       (endpoint = base URL + API key) ONCE, then add as
#                       many LLMs under it as you like; the platform shows
#                       you the "<provider>/<llm>" handle to paste here.
#                       The platform resolves that handle to the provider's
#                       base URL + key and the LLM's model string + API
#                       shape on the wire. NOTE: only the composite form is
#                       resolved — a bare LLM name or a raw provider model
#                       string (e.g. "deepseek-ai/DeepSeek-V4-Pro") is NOT
#                       matched and falls back to the platform-default
#                       endpoint. List handles with `gestalt platform llms
#                       list`.
#   llm.temperature — override the platform default sampling temperature
#   llm.max_tokens — every agent below now carries one, and this guidance is
#                       under review because of it (2026-09-19). The advice was
#                       written for OPERATORS adding a ceiling by hand; it was
#                       never true that no ceiling was set. The platform baseline
#                       set one on all 17 agents, invisibly, from a file this
#                       template's author never opened. Those exact values moved
#                       here unchanged, so behaviour is identical — but they are
#                       visible for the first time, and they are a "static output
#                       ceiling" by the definition below. Resolve it deliberately:
#                       either the ceilings are correct and this note is stale, or
#                       they re-introduce the mid-JSON cliff and should be dropped
#                       — which is a behaviour change, not a relocation.
#                       The original reasoning, unedited: the output budget is
#                       driven by the LLM registry row's `max_output_tokens`;
#                       list-producing agents commit one item at a time (append
#                       tool) and single-output agents expand the budget
#                       progressively on truncation, so a hardcoded ceiling only
#                       re-introduces the mid-JSON cliff.
#   llm.reasoning_effort — controls how much internal thinking the model
#                       does before responding (GPT-5.5+ family only).
#                       Values: xhigh | high | medium | low | non-reasoning
#                       Use 'high' for high-stakes decisions (architecture,
#                       self-healing); 'medium' for planning and evaluation;
#                       'low' for deterministic gate checks (temperature 0.0).
#                       Omit on agents whose model doesn't use the
#                       'responses' API shape — the parameter is silently
#                       dropped on classic chat-completions endpoints.
#   prompt_extensions — list of standing project rules appended to every
#                       prompt under a "Project-specific instructions"
#                       heading

agents:

  intent-agent:
    # The cross-check rule below was in the PLATFORM baseline for intent / design /
    # intent-design. This agent declares its own `rules`, and a declared list REPLACES
    # the baseline's rather than extending it — so this agent never actually received
    # it in production. Written here (2026-09-20), where it is visible and in effect.
    rules:
    - 'Before finalizing your output, cross-check it against the project''s maintained architecture
      (docs/ARCHITECTURE.md and .gestalt/architecture/reconciled.json) — provided to you as gathered
      reference context, NOT as an expansion of your task. If your output would contradict a decision
      already recorded there, do NOT silently diverge: flag the inconsistency (or consult the agent that
      owns it) so it is resolved deliberately. The maintained document is the source of truth for existing
      decisions.'
    - This intent describes a single phase of a multi-phase feature. If a 'Deferred to later phases' section is present, the items listed there are intentionally out of scope for this phase. Do not flag them as ambiguities or missing functionality.
    - Evaluate the intent against what this phase explicitly commits to delivering, not against the full feature description.
    - Interface method signatures in per-phase architecture specifications are CONTRACTS to be implemented by the code-agent during this phase. They are not stubs. An interface showing method signatures without bodies is correct and complete — do not flag missing method bodies as ambiguity or missing implementation.
    - When a '## Canonical dependencies for this phase' or '## Canonical entity fields for this phase' block is present in the intent text, those lists are the authoritative output of the per-phase architecture pass, which runs AFTER the intent text was generated. The intent text may reference outdated names from an earlier planning pass. This is EXPECTED and is NOT ambiguity. Do NOT emit a CONTEXT_GAP signal for any mismatch between names in the intent text and names in the canonical blocks. Instead, silently treat the canonical block as the correct specification and proceed. Mismatched names between intent text and canonical blocks are never high-impact ambiguity.
    role: "Senior software architect"
    goal: "Extract a precise, unambiguous specification from a natural language intent"
    llm:
      model: ~          # null = use platform default. Example: gpt-4o-mini
      temperature: 0.1
      max_tokens: 2000
    tools:
      builtin: [readFile, searchFiles]   # §2 — read code + reference docs while extracting the spec
    prompt_extensions: []
    profile: intent
    reference_paths:
    - HARNESS.json
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md
    - AGENTS.md
    - PLAN.md
    - .gestalt/architecture/reconciled.json
    artifact_path: .gestalt/{feature_id}/{phase_id}/{correlation_id}/intent-spec.json
    schema:
      models:
        _SuccessCriterion:
          fields:
            description:
              type: str
              optional: false
            testable:
              type: bool
              optional: false
              default: true
            layer:
              type: str
              optional: false
              enum:
              - unit
              - integration
              - e2e
              default: unit
        _Ambiguity:
          fields:
            description:
              type: str
              optional: false
            options:
              type: list[str]
              optional: false
              default_factory: list
            impact_if_wrong:
              type: str
              optional: false
              enum:
              - low
              - medium
              - high
              default: low
        _StringValue:
          fields:
            value:
              type: str
              optional: false
      fields: {}
      append:
        successCriteria: _SuccessCriterion
        constraints: _StringValue
        outOfScope: _StringValue
        ambiguities: _Ambiguity
      finalize:
        affected_domains:
          type: list[str]
          optional: false
          default_factory: list
        affected_layers:
          type: list[str]
          optional: false
          default_factory: list
        is_breaking_change:
          type: bool
          optional: false
          default: false
        estimated_complexity:
          type: str
          optional: false
          enum:
          - small
          - medium
          - large
          default: medium
      required_non_empty:
      - successCriteria

  design-agent:
    role: "Senior software architect"
    goal: "Produce domain model changes, API contracts, and component specs"
    llm:
      model: ~
      temperature: 0.2
      max_tokens: 4000
    tools:
      builtin: [readFile, listDirectory, searchFiles]   # §2 — inspect existing modules/patterns
    prompt_extensions:
      - "When your output is a collection of items, produce them one at a time — commit each item as you finish it, reason in free text between items, and signal completion when none remain. Never emit the entire collection in a single response."

  # Merged intent+design agent (consolidation Brief 2). Its structured-output schema, profile,
  # artifact path, and discovery budget (max_iterations) come from the platform baseline; this
  # declares only the tunable basics. It replaces intent-agent + design-agent in the pipeline.
    profile: design
    rules:
    - 'Before finalizing your output, cross-check it against the project''s maintained architecture
      (docs/ARCHITECTURE.md and .gestalt/architecture/reconciled.json) — provided to you as gathered
      reference context, NOT as an expansion of your task. If your output would contradict a decision
      already recorded there, do NOT silently diverge: flag the inconsistency (or consult the agent
      that owns it) so it is resolved deliberately. The maintained document is the source of truth for
      existing decisions.'
    reference_paths:
    - HARNESS.json
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md
    - AGENTS.md
    - PLAN.md
    - .gestalt/architecture/reconciled.json
    artifact_path: .gestalt/{feature_id}/{phase_id}/{correlation_id}/design-spec.json
    schema:
      models:
        _Field:
          fields:
            name:
              type: str
              optional: false
            type:
              type: str
              optional: false
            required:
              type: bool
              optional: false
        _Relationship:
          fields:
            entity:
              type: str
              optional: false
            type:
              type: str
              optional: false
        _DomainChange:
          fields:
            entity_name:
              type: str
              optional: false
            operation:
              type: str
              optional: false
              enum:
              - create
              - update
            fields:
              type: list[_Field]
              optional: false
              default_factory: list
            relationships:
              type: list[_Relationship]
              optional: false
              default_factory: list
        _ApiContract:
          fields:
            method:
              type: str
              optional: false
              enum:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
            path:
              type: str
              optional: false
            description:
              type: str
              optional: false
            request_body:
              type: dict[str, str]
              optional: true
            response_body:
              type: dict[str, str]
              optional: true
            auth_required:
              type: bool
              optional: false
              default: false
            roles:
              type: list[str]
              optional: false
              default_factory: list
        _ComponentSpec:
          fields:
            name:
              type: str
              optional: false
            type:
              type: str
              optional: false
              enum:
              - page
              - component
              - hook
              - service
            description:
              type: str
              optional: false
            props:
              type: dict[str, str]
              optional: true
      fields: {}
      append:
        domainChanges: _DomainChange
        apiContracts: _ApiContract
        componentSpecs: _ComponentSpec
      finalize: {}
      required_non_empty: []
  intent-design-agent:
    # The cross-check rule below was in the PLATFORM baseline for intent / design /
    # intent-design. This agent declares its own `rules`, and a declared list REPLACES
    # the baseline's rather than extending it — so this agent never actually received
    # it in production. Written here (2026-09-20), where it is visible and in effect.
    rules:
    - 'Before finalizing your output, cross-check it against the project''s maintained architecture
      (docs/ARCHITECTURE.md and .gestalt/architecture/reconciled.json) — provided to you as gathered
      reference context, NOT as an expansion of your task. If your output would contradict a decision
      already recorded there, do NOT silently diverge: flag the inconsistency (or consult the agent that
      owns it) so it is resolved deliberately. The maintained document is the source of truth for existing
      decisions.'
    - This spec describes a single phase of a multi-phase feature. If a 'Deferred to later phases' section is present, the items there are intentionally out of scope for this phase — do not flag them as ambiguities or missing functionality.
    - Evaluate the intent against what this phase explicitly commits to delivering, not against the full feature description.
    - Specify WHAT the implementation must satisfy (success criteria, entity/interface invariants, consistency requirements), NOT how to build it. Do not prescribe HTTP methods/paths, component names, or field lists — the code agent chooses the implementation shape.
    - A consistency requirement MUST name the exact file/interface to match (referencePath), so the code agent can reuse the existing type/method/pattern instead of drifting.
    role: "Senior software architect"
    goal: "Specify the phase's success criteria, constraints, and the consistency + interface invariants the implementation must satisfy — leaving implementation shape to the code agent"
    llm:
      model: ~
      temperature: 0.15
      max_tokens: 5000
    tools:
      builtin: [readFile, listDirectory, searchFiles]
    prompt_extensions:
      - "When your output is a collection of items, produce them one at a time — commit each item as you finish it, reason in free text between items, and signal completion when none remain. Never emit the entire collection in a single response."
    profile: intent-design
    reference_paths:
    - HARNESS.json
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md
    - AGENTS.md
    - PLAN.md
    - .gestalt/architecture/reconciled.json
    artifact_path: .gestalt/{feature_id}/{phase_id}/{correlation_id}/spec.json
    max_iterations: 10
    token_budget: 600000
    schema:
      models:
        _SuccessCriterion:
          fields:
            description:
              type: str
              optional: false
            testable:
              type: bool
              optional: false
              default: true
            layer:
              type: str
              optional: false
              enum:
              - unit
              - integration
              - e2e
              default: unit
        _Ambiguity:
          fields:
            description:
              type: str
              optional: false
            options:
              type: list[str]
              optional: false
              default_factory: list
            impact_if_wrong:
              type: str
              optional: false
              enum:
              - low
              - medium
              - high
              default: low
        _StringValue:
          fields:
            value:
              type: str
              optional: false
        _EntityInvariant:
          fields:
            entity:
              type: str
              optional: false
            must_exist_or_extend:
              type: bool
              optional: false
              default: true
            invariant:
              type: str
              optional: false
        _InterfaceConstraint:
          fields:
            operation:
              type: str
              optional: false
            auth_rule:
              type: str
              optional: false
              default: ''
            idempotent:
              type: bool
              optional: false
              default: false
            error_semantics:
              type: str
              optional: false
              default: ''
        _ConsistencyRequirement:
          fields:
            requirement:
              type: str
              optional: false
            reference_path:
              type: str
              optional: false
              default: ''
        _IntegrationPoint:
          fields:
            target:
              type: str
              optional: false
            why:
              type: str
              optional: false
              default: ''
      fields: {}
      append:
        successCriteria: _SuccessCriterion
        constraints: _StringValue
        outOfScope: _StringValue
        ambiguities: _Ambiguity
        entityInvariants: _EntityInvariant
        interfaceConstraints: _InterfaceConstraint
        consistencyRequirements: _ConsistencyRequirement
        integrationPoints: _IntegrationPoint
      finalize:
        affected_domains:
          type: list[str]
          optional: false
          default_factory: list
        affected_layers:
          type: list[str]
          optional: false
          default_factory: list
        is_breaking_change:
          type: bool
          optional: false
          default: false
        estimated_complexity:
          type: str
          optional: false
          enum:
          - small
          - medium
          - large
          default: medium
      required_non_empty:
      - successCriteria

  context-agent:
    role: "Technical writer"
    write_paths:
      # Brief 1 — what THIS agent may write. GOVERNANCE files (docs/GOLDEN_PRINCIPLES.md,
      # HARNESS.json, agents.yaml, harness/pipeline.yaml) are refused regardless of what is
      # listed here: a per-project config must not grant an agent authority over the rules the
      # platform judges the project by. See gestalt_core/agents/write_policy.py.
      - docs/ARCHITECTURE.md
      - docs/DOMAIN.md
      - docs/DECISIONS.md
      - AGENTS.md
    goal: "Keep project context files accurate and up to date"
    llm:
      model: ~
      temperature: 0.1
      max_tokens: 8000
    tools:
      builtin:
        - readFile          # read existing context files before updating
        - listDirectory     # explore the docs/ structure
        - searchFiles       # find where references need to change
        - getFileTree       # understand project layout
        - gitDiff           # §2 — see what this phase changed before updating docs
    prompt_extensions: []
    profile: context
    # §3 — NARROWED to the files this agent MAINTAINS. Audited on run f890ed1a: all five previous
    # references were read exactly 8 times each (once per invocation), which is the turn-1 bulk
    # load, not evidence of need — the agent loads every reference it is given before it knows what
    # the phase changed.
    #   docs/ARCHITECTURE.md  KEPT   it writes this; 16 reads (8 whole + 8 paged remainders)
    #   AGENTS.md             KEPT   it writes this
    #   docs/DOMAIN.md        ADDED  it writes this and read it 15x by discovering it itself
    #   docs/DECISIONS.md     ADDED  same, 6 reads
    #   docs/GOLDEN_PRINCIPLES.md  DROPPED — since Brief 1 it CANNOT write this file (governance),
    #                          and it does not need to READ it either: the gate judges the code
    #                          against the principles; documenting what a phase built does not.
    #   HARNESS.json          DROPPED — project identity and infrastructure; nothing a phase's
    #                          documentation depends on.
    #   PLAN.md               DROPPED — redundant with the phase spec, which the task already
    #                          injects by path and which the instruction points at for drift checks.
    reference_paths:
    - docs/ARCHITECTURE.md
    - docs/DOMAIN.md
    - docs/DECISIONS.md
    - AGENTS.md
    artifact_path: .gestalt/{feature_id}/{phase_id}/{correlation_id}/context-updates.json
    token_budget: 800000
    schema:
      models:
        _Update:
          fields:
            path:
              type: str
              optional: false
              description: Context file path, e.g. docs/DOMAIN.md or AGENTS.md
            section:
              type: str
              optional: true
              description: >-
                STRONGLY PREFERRED. The exact markdown heading text whose body this update
                replaces, e.g. "Phase 3 delivered" — copy it verbatim from the heading index in
                your task. With it, `content` is the NEW BODY OF THAT SECTION ONLY and every
                other byte of the file is left untouched, so you need only read that section.
                You may write the body alone — the heading line is kept for you.
                Omit it ONLY to create a new file or to rewrite one whole, which requires having
                read the entire file and is refused otherwise.
            content:
              type: str
              optional: false
              description: >-
                With `section`, the new body of that section alone. Without `section`, the FULL
                new contents of the file.
      fields: {}
      append:
        updates: _Update
      finalize: {}
      required_non_empty: []

  code-agent:
    # ADR-060 reference docs the code agent reads (CONFIG, not hardcoded): the stack, the
    # architecture, the plan, the coding conventions, and the cross-cutting golden principles the
    # quality gate enforces. Override per project; omit to inherit the platform default.
    reference_paths:
    - HARNESS.json
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md
    - AGENTS.md
    - PLAN.md
    rules:
    - Generated code must compile without errors. Verify with executeScript before returning.
    - All imports must resolve to files that exist in the project or are declared in package.json.
    - You MUST run a compile/lint check via executeScript before emitting the final files. This is not optional.
    - Do not use require() for JSON imports — import them using ES module syntax with resolveJsonModule enabled in tsconfig.
    - Before generating any repository, service, or controller code, read the DTO and interface files it will use. Never reference a field on a type without confirming it exists in the type definition.
    - Before generating code that calls methods on a dependency, read the dependency's source file to confirm which methods exist. Only call methods that are actually defined.
    - Read the project's compiler/linter configuration file (tsconfig.json, mypy.ini, pyproject.toml, .eslintrc etc) before generating code. Follow the strictness settings it defines — do not assume permissive defaults.
    - Read the project's dependency manifest (package.json, requirements.txt, go.mod, pom.xml etc) before importing external packages. Only import packages that are listed as dependencies.
    - Your verification command is configured to fail when no source implementation files exist. You MUST write implementation files before verification can pass. Do not consider the task complete based on a passing verification that ran before any source files were written.
    - When code in one module needs data or behavior owned by another module, depend on that module's public SERVICE interface — never import another module's repository or other private files. A module's repository is private to that module; cross-module access goes through the owning module's service. A service may import its own module's repository interface (the standard repository pattern).
    - Every method that calls an injected repository or external service must wrap the call in explicit error handling. Do not let errors from dependency calls propagate unhandled.
    role: "Senior TypeScript engineer"
    goal: "Generate production-quality TypeScript code that follows the project harness"
    llm:
      model: ~          # Example: set to "gpt-4o" to use a specific model
      temperature: 0.2
      max_tokens: 8000
    tools:
      builtin:
        - readFile          # read existing files before modifying
        - listDirectory     # explore the project structure
        - searchFiles       # find where things are defined
        - getFileTree       # understand project layout
        - executeScript     # verify generated code (compile / lint / etc.)
                            # The agent picks the command — there are NO
                            # hardcoded shell strings on the platform.
                            # Hard blocklist: rm -rf, git push/commit/reset/rebase,
                            # curl|sh, wget|sh, > /etc/, sudo (never overridable).
      # ADR-039 — MCP (Model Context Protocol) servers extend the
      # agent with external tools (issue trackers, dashboards, docs).
      # Tool names are auto-namespaced as `<serverName>__<toolName>`
      # so they cannot shadow the built-ins.
      #
      # token_from sources:
      #   harness            — reads HARNESS.json mcp.servers[].token
      #                        (token sits in the project repo —
      #                        visible to anyone with repo access)
      #   project_credential — reuses the project Git PAT
      #   env:VAR_NAME       — reads process.env.VAR_NAME on the
      #                        server process (recommended for any
      #                        sensitive secret)
      # mcp:
      #   - name: github
      #     url: https://mcp.github.com/v1
      #     token_from: env:GITHUB_MCP_TOKEN
      #   - name: localfs
      #     url: stdio:npx @modelcontextprotocol/server-filesystem /tmp/project
      #     token_from: env:NOOP   # stdio servers usually don't need a token
    # Stack-specific coding conventions generated by the
    # `generateStackConfig` LLM call at `gestalt init` time.
    # Add more project-specific extensions below as needed.
    #
    # TR_081 — the code-agent manages Aider via structured AiderDecisions.
    # This first extension sets the edit-format preference; the stack
    # conventions below are conveyed to Aider in the decision message.
    prompt_extensions:
      - "Begin each phase with the architect edit format — it plans multi-file changes best. Only fall back to the diff edit format when you have EVIDENCE of assistant-mode drift in the feedback (the model acknowledged file additions conversationally without producing edits, and no files were written). Do not pre-emptively avoid architect."
    max_iterations: 30
    condenser_max_tokens: 50000
    condenser_max_size: 80
    delegation_max_subtasks: 4
    delegation_subagent_iterations: 30

  test-agent:
    role: "Senior QA engineer"
    goal: "Generate comprehensive Jest tests mapped to success criteria"
    llm:
      model: ~
      temperature: 0.1
      max_tokens: 6000
    prompt_extensions: []

  # ── Gate layer (Amendment 2026-06: tools enabled by default) ──
  constraint-agent:
    role: "Architectural constraint evaluator"
    goal: "Verify generated code satisfies all project architectural rules using executeScript + read-only file tools"
    llm:
      model: ~
      temperature: 0.0
      max_tokens: 4000
    tools:
      # §2 — gitDiff is a first-class tool now, not a shell command. It serves per-file HUNKS
      # (bounded, refusing a file outside the phase diff) and is read_only, so an identical
      # repeat collapses to a stub instead of re-appending its body. On run f890ed1a the
      # agent made 38 shell `git diff <file>` calls for content this tool did not yet serve,
      # 26 for a file list it had already been handed, and 17 `git rev-parse --show-toplevel`.
      builtin: [executeScript, readFile, searchFiles, getFileTree, gitDiff]
    prompt_extensions: []
    rules:
    - Data access is only permitted in the designated data access layer of this project. Code in business logic, presentation, or routing layers must delegate all data operations to the data access layer.
    - The data access layer is the only layer permitted to contain connection management, query execution, and direct interaction with the data store.
    - Each architectural layer communicates only with its immediately adjacent layer. Layers must not bypass intermediate layers.
    - Dependencies flow in one direction only — from outer layers toward inner layers. Inner layers must not depend on outer layers. Separately, a CROSS-MODULE dependency is permitted ONLY if the importing module's entry in the dependency map in ARCHITECTURE.md lists the imported module. An import of a module that is absent from that list IS a violation even when both modules sit at the same layer — report it with rule id dependency-direction.
    - Error handling must be explicit. Callers must not be exposed to unhandled failures from dependencies.
    - 'Do not redefine a symbol another module already owns. The platform has ALREADY enumerated every exported declaration in this repository and given you the complete list of names exported by more than one module, in the ''Symbol-ownership candidates (R6)'' section below. Judge those candidates: for each one, read the declarations and decide whether they are the SAME CONCEPT (same shape, same meaning, one rightful owner) or genuinely DIFFERENT concepts that happen to share a name. The test is conceptual identity, NOT name identity — a shared name with different fields or meaning, owned by THIS module, is a legitimately distinct declaration and is not a violation. Where they ARE the same concept, the fix is to import from the owning module''s public entry point instead of declaring a second copy. DO NOT search, grep, list or sweep the tree for candidates: the list is computed and complete, and a sweep is how this rule used to consume an entire review budget without reaching a verdict. The ''Deterministic checks the platform has ALREADY run'' block states R6''s result explicitly, including when it is zero — trust that line and do NOT grep to confirm it.'
    verificationGuidance:
    - Before evaluating any finding, read ARCHITECTURE.md to understand this project's specific layer names, boundaries, and directory structure. Use this to determine what constitutes the data access layer, business logic layer, and routing layer for this project.
    - A finding is only valid if it violates a rule given the actual structure of this project as described in ARCHITECTURE.md.
    - 'Scope your evaluation to the files changed in this phase only; files outside that set were passing
      before this phase, so do not re-evaluate them. When the ''Phase scope'' block LISTS the changed
      files, those are authoritative — evaluate exactly them and do NOT re-derive the list, because a
      second derivation can disagree with the one the platform already resolved. Only when the block gives
      a defaultBranch but no file list should you derive it yourself: run `git diff
      origin/<defaultBranch>..HEAD --name-only` (TWO dots — the clone is shallow, so three-dot/merge-base
      diffs do not resolve) via executeScript. If that fails or returns empty, fall through to evaluating
      the artifact files inlined above.'
    - 'The repository pattern is sanctioned data-access delegation. A business-logic-layer service that depends on a repository INTERFACE — via constructor injection or by importing the interface type — is correctly delegating data access to the data access layer; this is NOT a data-access-layer violation. Only flag a data-access violation when a non-data-access-layer file performs data access DIRECTLY: inline SQL, connection management, query execution, or direct datastore calls.'
    - Before reporting an import as a broken, missing, or non-existent dependency, confirm the target file is actually absent on the branch using readFile or `ls` via executeScript. A file created in a PRIOR phase is intentionally not in this phase's git diff but DOES exist on the branch — never flag an import of a prior-phase file as broken or missing.
    - Consult the dependency-direction graph in ARCHITECTURE.md. A cross-module dependency that follows a documented allowed direction is sanctioned — do not flag it as a circular or bidirectional-dependency risk unless you find an ACTUAL reverse import that creates a cycle. Speculative risk is not a violation.
    - The project's shared infrastructure directory (the common/shared module location defined in ARCHITECTURE.md) hosts cross-cutting infrastructure — shared connection pools or clients, utility modules, and shared type definitions. This directory is sanctioned shared infrastructure, NOT a layering violation. Data-access-layer code that imports a shared connection pool or client from the shared infrastructure directory is following the correct pattern. Do NOT flag such imports as data-access-layer violations, and do NOT flag the shared connection/utility module itself as data access outside the data access layer.
    - A service class calling a method on an injected repository interface is correct delegation to the data-access layer. Do NOT flag this as direct data access — the call goes through the interface, not to a data store directly.
    - Reading properties or fields on a domain model object that was returned by a repository call is business logic, not data access. Do NOT flag field access on fetched domain objects as a data-access-layer violation.
    reference_paths:
    - HARNESS.json
    - docs/ARCHITECTURE.md
    - docs/GOLDEN_PRINCIPLES.md
