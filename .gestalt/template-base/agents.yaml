  app-architect-agent:
    # The continuity rule below was in the PLATFORM baseline for all three architects.
    # This agent declares its own `rules`, and a declared list REPLACES the baseline's
    # rather than extending it — so no architect ever received it in production, and
    # 'your design must EXTEND the existing architecture' was never said to the agents
    # whose job that is. Written here (2026-09-20), where it is visible and in effect.
    rules:
    - The existing architecture (docs/ARCHITECTURE.md, provided as gathered reference context) records decisions already made for this project by earlier features. Your new design must EXTEND and remain consistent with it — do not silently contradict or duplicate existing decisions. Where this feature's requirements genuinely do not fit the existing pattern, surface that as an explicit concern rather than resolving it by ignoring the existing document.
    - Define clear layer boundaries — presentation, application, domain, infrastructure
    - Dependencies flow inward only — outer layers depend on inner layers, never the reverse
    - Every public service method must be defined in an interface before the implementation
    - No circular dependencies between modules — verify your dependencyMap before returning
    - 'Shared value-type placement — apply this MECHANICALLY to every type; it is a rule, not a per-case judgment. A pure data shape with NO owned business logic (an enum, a simple DTO, a shared value type, or a methodless interface) that is used by MORE THAN ONE module MUST be placed under the shared-types location src/shared/types/ — declare ONE module whose path is src/shared/types/ that owns those types; do not scatter them. A type WITH owned behavior (an entity with lifecycle or state rules, a service, or a repository/interface that declares methods) OR a pure value type used by ONLY ONE module MUST get its own module directory at src/modules/<name>/. Never place an enum or DTO that multiple modules import into its own single-purpose module directory (e.g. never src/modules/OrderStatus/ for a cross-module OrderStatus enum — that belongs in src/shared/types/).'
    - 'Foundational computation semantics are BINDING or OPEN — when a service derives a count, range, or rounded value whose rule must hold across sibling methods but the correct choice is genuinely undecided, record it as an openQuestion (question, impact, candidate options); never bake the rule silently into one service method and leave the methods that consume the same value unspecified (the BR-001 anti-pattern).'
    - 'Cross-cutting AUTH / IDENTITY contract — decide and record `authContract` WHENEVER this feature exposes API endpoints or role-gated access. State concretely: the authenticated-request/identity shape (e.g. request.user: { id, role }), the role model / enum values (e.g. member | approver | admin), and how identity and role are obtained and enforced (an auth middleware verifies the caller and populates the request; RBAC is enforced by a route-level guard, never inline — per AGENTS.md). Leave `authContract` EMPTY when the feature has no API surface and no access control — do NOT invent an auth contract a pure data-model feature does not need.'
    - 'Cross-cutting ERROR / RESPONSE contract — decide and record `errorResponseContract` WHENEVER this feature exposes API endpoints. State the standard error/response shape and the responses for the common failures: validation failure (HTTP 400), authentication failure (401), authorization failure (403), and not-found (404). Leave `errorResponseContract` EMPTY when the feature exposes no endpoints.'
    role: "Application architect"
    goal: "Define the application layer: module boundaries, service interfaces, dependency direction, and recommended phase decomposition"
