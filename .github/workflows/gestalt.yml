# Gestalt-managed pipeline (ADR-033 + ADR-041).
#
# ADR-041 — CI is the primary runtime quality gate. It runs lint,
# tests, and a security scan before the Gestalt LLM gate
# (constraint-agent + review-agent) is dispatched against the same
# branch. The LLM gate focuses exclusively on architectural
# compliance and design-spec adherence; it never re-runs anything
# CI already validated.
#
# Dispatched by the platform on two occasions:
#   1. pipeline-agent triggers it after pr-agent opens (or pushes to)
#      a PR — this is the build/test/lint/security check that gates
#      the gate
#   2. promotion-agent triggers it on each environment promotion
#      (`environment` input set to `staging` then `production`)
#
# Setup steps + commands are stack-specific — generated by the
# `generateStackConfig` LLM call at `gestalt init` time from the
# project description. Customise below for your project's
# build / lint / integration test / deploy commands.

name: gestalt
# TR_020 — one CI run per Aider push for the build/test/lint/scan
# quality job. PR-Agent (ADR-051 / TR_027) runs SERVER-SIDE inside
# the Gestalt container via `executeScript` after CI passes —
# Gestalt's own LLM credentials drive it, and `.pr_agent.toml`
# committed to the project repo carries the project-specific
# review focus. No CI step or repo secret required.
#   - `push`             triggers `quality` (build / test / lint /
#                        security) on every Gestalt branch commit.
#   - `workflow_dispatch` retained ONLY for promotion-agent's
#                        staging / production deploy invocation
#                        (different `inputs.environment` value).
on:
  push:
    branches: ['gestalt/**', 'feature/**', 'phase/**', 'retry/**', 'fix/**']
    # Gestalt writes its own bookkeeping artifacts (planning specs, per-agent
    # .gestalt/** outputs incl. openhands sessions, PLAN.md, all docs/** the
    # context-agent maintains, AGENTS.md) as commits on these same branches.
    # A commit touching ONLY these needs no CI. GitHub runs the job only when the
    # push matches a branch pattern AND at least one changed file is NOT ignored,
    # so any commit that also touches src/tests/config still triggers CI normally.
    # This is Gestalt's FIXED platform-owned output set — the same block belongs in
    # every Gestalt-onboarded project's CI trigger.
    paths-ignore:
      - '.gestalt/**'
      - 'PLAN.md'
      - 'docs/**'
      - 'AGENTS.md'
  # EVERY pull request gets CI, whatever the branch is called.
  #
  # The `push` trigger above matches only the five prefixes the PLATFORM creates. A human PR
  # from `chore/**` or `feat/**` therefore reported ZERO checks — and on 2026-09-30 three of
  # them (#644, #650, #651) were merged that way, because a merge loop read "no checks" as
  # "nothing failed". `pull_request` has no branch-name condition, so it cannot develop the
  # same gap: a prefix nobody thought of is still covered.
  #
  # `branches:` is deliberately absent. For `pull_request` it filters the BASE branch, not the
  # head, so it could not express "skip platform branches" even if that belonged here — that
  # exclusion is the job-level `if:` below, which is the only level GitHub lets it live at.
  pull_request:
    paths-ignore:
      - '.gestalt/**'
      - 'PLAN.md'
      - 'docs/**'
      - 'AGENTS.md'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging | production). Other values are accepted on CI-only dispatches.'
        required: false
        default: 'staging'
        type: string
      correlationId:
        description: 'Gestalt correlation id for this intent cycle.'
        required: false
        type: string
      branch:
        description: 'Source branch for the dispatched run.'
        required: false
        type: string

jobs:
  quality:
    runs-on: ubuntu-latest
    # A platform-managed branch already gets a `push` run, and the platform reads ONLY push
    # runs — `_find_push_run` queries `event=push` and now also filters on it client-side. A
    # `pull_request` run on the same commit would be a second run that nothing reads, on every
    # phase of every feature. So it is skipped rather than duplicated.
    #
    # This is a COST decision, not a correctness one: the two runs were never ambiguous to
    # `poll_ci`. Human PRs — any branch name outside these five prefixes — are unaffected and
    # are the reason the trigger exists.
    if: >-
      github.event_name != 'pull_request'
      || !(startsWith(github.head_ref, 'gestalt/')
           || startsWith(github.head_ref, 'feature/')
           || startsWith(github.head_ref, 'phase/')
           || startsWith(github.head_ref, 'retry/')
           || startsWith(github.head_ref, 'fix/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # TR_019 follow-up — the upstream npm arborist `Link.matches`
      # null-pointer bug ("Cannot read properties of null (reading
      # 'matches')") fires on multiple recent npm versions regardless
      # of --legacy-peer-deps. Pin to npm@10.5.0 (last known-good for
      # this codepath) and use --force to bypass the broken peer-
      # resolution path. Remove the pin + --force when the upstream
      # fix lands.
      - run: npm install -g npm@10.5.0
      - run: npm install --force --legacy-peer-deps

      # The frontend is a SEPARATE npm project (no workspaces), so the root install above does
      # not reach it. Without this, every `web/` step below fails on missing modules.
      - name: Install web dependencies
        run: |
          if [ -f web/package.json ]; then
            cd web && npm install --force --legacy-peer-deps
          fi

      # ── 🔴 SECRET SCAN — BLOCKING, and the ONE exception to the non-blocking design below.
      #
      # That design exists so an infra finding cannot fail a phase unrecoverably, and it is right
      # for CORRECTNESS checks: a broken compile is recoverable by a self-heal, a re-run or a
      # human. Publishing a credential is not. On 2026-10-09 a `git add -A` committed this repo's
      # `.env` — DATABASE_URL and JWT_SECRET — to a feature branch; rewriting the history within
      # the hour did not help, because GitHub still served the orphaned commits by SHA, and both
      # values had to be rotated. A failed phase costs a re-run; a published secret cannot be
      # taken back.
      #
      # It runs BEFORE the build so a push carrying a secret fails fast, and it is deliberately
      # NOT recorded in ci-results.json: the CI-agent weighs findings by severity, and there is no
      # severity at which a credential may proceed. The job simply fails.
      #
      # The binary is PINNED and fetched from the release rather than run through a third-party
      # action — a secret gate that resolves a moving tag is the wrong shape.
      - name: Secret scan (BLOCKING)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

      # ── Every check is NON-BLOCKING (continue-on-error) — the Gestalt CI-agent is the SOLE gate.
      # No individual check's exit code decides "does this phase proceed"; each check RUNS and
      # REPORTS its outcome (collected below into ci-results.json), and the CI-agent judges the
      # collected outcomes + logs by DevOps severity. A real compile/test/security failure still
      # blocks (via the CI-agent); an infra finding (e.g. mutable-action-tag on the workflow file)
      # no longer fails the phase unrecoverably. Platform-provided pattern — see
      # docs/guides/ci-cd/github-actions.md. Each check carries an `id:` so its `.outcome` is
      # recorded even when it fails. (Setup steps above stay blocking — they are prerequisites.)
      - name: Compile
        id: compile
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            npm run build
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "Python project — no compile step"
          elif [ -f go.mod ]; then
            go build ./...
          elif [ -f Cargo.toml ]; then
            cargo build
          else
            echo "No project manifest found yet — skipping compile (run 'gestalt run' to scaffold the project)"
          fi

      - name: Test
        id: test
        continue-on-error: true
        run: |
          if [ -f package.json ] || [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f go.mod ] || [ -f Cargo.toml ]; then
            npm run test
          else
            echo "No project manifest found yet — skipping tests (run 'gestalt run' to scaffold the project)"
          fi

      # ── The frontend was compiled and tested by NOTHING. The root `npm run build` is
      # `tsc --noEmit` over `include: ["src"]` and the root `npm test` is jest with
      # `testMatch: **/tests/**`, so `web/src/**` — 17 test files and the whole React app —
      # reached neither. This is the same #152 frontend blindness the Lint step below already
      # fixed for lint: `web` appeared in this workflow exactly once, in a comment.
      #
      # Both steps are `continue-on-error` and recorded in ci-results.json like the rest, so the
      # CI-agent judges them rather than the job failing outright.
      - name: Compile (web)
        id: compile_web
        continue-on-error: true
        run: |
          if [ -f web/package.json ]; then
            cd web && npx tsc --noEmit
          else
            echo "No web/ project — skipping web compile"
          fi

      - name: Test (web)
        id: test_web
        continue-on-error: true
        run: |
          if [ -f web/package.json ] && node -p "!!(require('./web/package.json').scripts||{}).test" 2>/dev/null | grep -q true; then
            cd web && npm run test
          else
            echo "No web/ test script — skipping web tests"
          fi

      - name: Lint
        id: lint
        continue-on-error: true
        # Prefer the PROJECT'S OWN `npm run lint`, so CI lints exactly what the
        # project says it lints. The previous form hardcoded `eslint@8 src`, which
        # covered 66 of 143 files: every file under `web/src` was unlinted, and a
        # planted `any` there passed CI while the identical line in `src` failed.
        # That is the #152 frontend blindness again, in CI rather than the gate.
        # The `npx eslint@8 .` fallback stays for a project with a config but no
        # lint script; it is pinned to 8 because npx's default major requires flat
        # config and a project on legacy .eslintrc.* breaks with
        # "ESLint couldn't find an eslint.config file".
        run: |
          if [ -f package.json ] || [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f go.mod ] || [ -f Cargo.toml ]; then
            if ls eslint.config.js eslint.config.mjs eslint.config.cjs .eslintrc.js .eslintrc.cjs .eslintrc.json .eslintrc.yml .eslintrc.yaml 2>/dev/null | grep -q .; then
              if [ -f package.json ] && node -p "!!(require('./package.json').scripts||{}).lint" 2>/dev/null | grep -q true; then
                npm run lint
              else
                npx eslint@8 . --max-warnings 0
              fi
            else
              echo "No eslint config in tree — skipping lint"
            fi
          else
            echo "No project manifest found yet — skipping lint"
          fi

      - name: Security scan
        id: semgrep
        continue-on-error: true
        # Run Semgrep directly via pip (the dedicated action is deprecated/archived). NO `--error`
        # and NO `--exclude` — the CI-agent is the sole gate now, so semgrep just REPORTS (JSON to
        # an artifact) and the agent classifies each finding (a real vuln on app code → blocking;
        # a mutable-action-tag on this workflow file → infra-noise → surfaced, not blocking). This
        # supersedes the earlier temporary `--exclude '.github/workflows'` narrowing.
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config auto --disable-version-check --json --output semgrep.json || true

      # ── Collect every check's REAL outcome (`.outcome`, not `.conclusion`) so the CI-agent sees a
      # failed compile/test even though the job 'passes' (each check is continue-on-error). `always()`
      # ensures this runs regardless of upstream outcomes.
      - name: Collect CI check results (for the Gestalt CI-agent)
        if: always()
        run: |
          cat > ci-results.json <<JSON
          { "checks": [
            { "name": "compile", "outcome": "${{ steps.compile.outcome }}" },
            { "name": "test",    "outcome": "${{ steps.test.outcome }}" },
            { "name": "compile-web", "outcome": "${{ steps.compile_web.outcome }}" },
            { "name": "test-web",    "outcome": "${{ steps.test_web.outcome }}" },
            { "name": "lint",    "outcome": "${{ steps.lint.outcome }}" },
            { "name": "semgrep", "outcome": "${{ steps.semgrep.outcome }}" }
          ] }
          JSON
          echo "CI check outcomes:"; cat ci-results.json

      # Two SEPARATE artifacts — the CI-agent reads each by name (they are parsed differently, so
      # they must not be concatenated into a single artifact zip).
      - name: Upload CI check-outcome summary for the CI-agent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: ci-results.json
          if-no-files-found: ignore

      - name: Upload semgrep results for the CI-agent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep.json
          if-no-files-found: ignore
